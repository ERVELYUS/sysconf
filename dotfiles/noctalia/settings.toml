[audio]
enable_overdrive = true

[bar.default]
capsule = true
center = [ "workspaces" ]
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery" ]
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
start = [ "control-center", "date", "clock", "keyboard_layout", "audio_visualizer" ]

[battery]
warning_threshold = 20

[desktop_widgets]
enabled = false

[idle]
pre_action_fade_seconds = 0

[location]
address = "moscow"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000006"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 120.0
    box_width = 512.0
    cx = 960.0
    cy = 888.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 208.0
    box_width = 496.0
    cx = 960.0
    cy = 600.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 64.0
    box_width = 64.0
    cx = 1824.0
    cy = 1112.0
    output = "eDP-1"
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        command = "shutdown 0"
        glyph = "shutdown"
        label = ""
        variant = "default"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 112.0
    box_width = 256.0
    cx = 192.0
    cy = 1104.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 64.0
    box_width = 64.0
    cx = 1728.0
    cy = 1112.0
    output = "eDP-1"
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        command = "reboot"
        glyph = "reboot"
        label = ""
        variant = "default"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 64.0
    box_width = 64.0
    cx = 1632.0
    cy = 1112.0
    output = "eDP-1"
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        background = false
        command = "logout"
        glyph = "logout-2"
        label = ""
        variant = "default"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 128.0
    box_width = 480.0
    cx = 960.0
    cy = 1112.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        background = false
        hide_when_no_media = true
        layout = "horizontal"

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/olafkfreund/nocatalia-v5-plugins"
    name = "v5-plugins"

[shell]
clipboard_auto_paste = "ctrl_v"
clipboard_confirm_clear_history = false
font_family = "JetBrainsMono Nerd Font Mono"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true

[theme]
builtin = "Tokyo-Night"
community_palette = "GitHub Dark"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

[wallpaper]
directory = "/home/nick/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/nick/Pictures/Wallpapers/fin.jpg"

    [wallpaper.last]
    path = "/home/nick/Pictures/Wallpapers/fin.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/nick/Pictures/Wallpapers/fin.jpg"

[widget.audio_visualizer]
centered = false
mirrored = false
width = 100.0

[widget.control-center]
glyph = "fish-bone"

[widget.date]
format = "{:%d.%m.%Y}"

[widget.keyboard_layout]
show_icon = false

[widget.network]
show_label = false

[widget.workspaces]
hide_when_empty = true
scale = 1.05